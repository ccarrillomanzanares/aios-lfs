<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIOS — web v2 (desarrollo)</title>
<style>
:root{
  --bg:#000000; --ink:#33ff33; --bright:#00ff00; --dim:#008800; --dim2:#006600;
  --line:#006400; --panel:#001100; --mono:"Consolas","Menlo","DejaVu Sans Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--mono); background:var(--bg); color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; overflow-y:auto; /* sin scroll si se puede; si no, que fluya */
}
/* ---------- identidad común ---------- */
.hex{display:inline-block;filter:drop-shadow(0 0 10px rgba(0,255,0,.4))}
h1{color:var(--bright);letter-spacing:.18em;text-shadow:0 0 14px rgba(0,255,0,.45);font-weight:700}
.tagline{color:var(--dim);letter-spacing:.06em}
#greeting{color:var(--bright);display:inline}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--bright);
  animation:blink 1s step-start infinite;vertical-align:text-bottom}
@keyframes blink{50%{opacity:0}}
.btn{
  display:inline-block;background:#003300;color:var(--bright);text-decoration:none;
  padding:1.15rem 2.4rem;border-radius:4px;border:1px solid var(--bright);font-family:inherit;
  font-size:1.05rem;letter-spacing:.05em;transition:background .2s, box-shadow .2s;text-align:center;
}
.btn:hover{background:#004400;box-shadow:0 0 14px rgba(0,255,0,.25)}
.btn small{display:block;color:var(--dim);font-size:.72rem;margin-top:.25rem;letter-spacing:0}
.partners{display:flex;align-items:center;gap:2.2rem;justify-content:center;flex-wrap:wrap}
.partners a{color:var(--bright);text-decoration:none;display:inline-flex;align-items:center}
.partners img{height:36px;width:auto;opacity:.9}
.partners img.inception{height:50px}
.github{color:var(--dim);font-size:.62rem}
.github a{color:var(--bright);text-decoration:none}
.github a:hover{text-decoration:underline}
.foot{color:var(--dim2);font-size:.72rem;text-align:center}
/* ---------- picker (solo desarrollo) ---------- */
.picker{
  position:fixed;bottom:10px;left:10px;z-index:99;display:flex;gap:6px;
  background:#000c00;border:1px solid var(--line);border-radius:4px;padding:5px;
}
.picker button{
  background:transparent;color:var(--dim);border:1px solid transparent;border-radius:3px;
  font-family:inherit;font-size:.72rem;padding:4px 10px;cursor:pointer;
}
.picker button.active{color:var(--bright);border-color:var(--line);background:#002200}
/* =========================================================
   V1 — TERMINAL: la web ES la terminal de AIOS
   ========================================================= */
.v1 .screen{
  width:min(880px,95vw);height:min(94vh,660px);background:var(--panel);
  border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;
  overflow:hidden;box-shadow:0 0 30px rgba(0,255,0,.05);
}
.v1 .term-bar{
  display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);flex-shrink:0;
}
.v1 .term-title{color:var(--dim);font-size:.72rem;letter-spacing:.05em}
.v1 .term-body{flex:1;display:flex;flex-direction:column;
  padding:1.1rem 1.8rem;overflow:hidden}
.v1 .brand{text-align:center}
.v1 .brand .hex svg{width:150px;height:auto}
.v1 h1{font-size:1.9rem;margin:.45rem 0 .2rem}
.v1 .tagline{font-size:.9rem}
.v1 .phrase{margin-top:.85rem;font-size:.85rem;min-height:2.4em;display:flex;justify-content:center;align-items:center;
  background:#000600;border:1px solid #003800;border-radius:4px;padding:.5rem .9rem}
.v1 .action{text-align:center;margin-top:1.5rem}
.v1 .cmdline{color:var(--dim);font-size:.8rem;margin-bottom:.7rem}
.v1 .cmdline .prompt{color:var(--bright)}
.v1 .cmdline .cmd{color:var(--ink)}
.v1 .btn{margin-bottom:.9rem}
.v1 .partners{margin-bottom:.8rem}
.v1 .github{font-size:.72rem}
.v1 .foot{display:none}
.v1 .term-foot{padding:.5rem 1.8rem .7rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;
  color:var(--dim2);font-size:.68rem;flex-shrink:0}
/* =========================================================
   V2 — SPLIT: identidad a la izquierda, acción a la derecha
   ========================================================= */
.v2 .screen{
  width:min(940px,95vw);display:grid;grid-template-columns:1.25fr 1fr;gap:2.5rem;align-items:center;
}
.v2 .brand{text-align:left}
.v2 .brand .hex svg{width:88px;height:auto}
.v2 h1{font-size:2.6rem;margin:.7rem 0 .3rem}
.v2 .tagline{font-size:.9rem}
.v2 .phrase{margin-top:1.2rem;font-size:.85rem;min-height:3.4em;line-height:1.5}
.v2 .action{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:1.8rem 1.6rem;display:flex;flex-direction:column;align-items:center;gap:1.1rem}
.v2 .action .btn{width:100%}
.v2 .partners{margin-top:.3rem}
.v2 .foot{grid-column:1/-1;margin-top:.4rem}
/* =========================================================
   V3 — CENTRADO: una columna, sin cajas, puro aire
   ========================================================= */
.v3 .screen{text-align:center;width:min(760px,94vw)}
.v3 .brand .hex svg{width:60px;height:auto;opacity:.9}
.v3 h1{font-size:2.2rem;margin:.55rem 0 .25rem}
.v3 .tagline{font-size:.85rem}
.v3 .phrase{margin:1.1rem auto 0;font-size:.88rem;min-height:3em;max-width:640px;line-height:1.5}
.v3 .action{margin-top:1.6rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
.v3 .partners{margin-top:.2rem}
.v3 .github{margin-top:.2rem}
.v3 .foot{margin-top:1.4rem}
/* ---------- responsive ---------- */
@media (max-width:760px){
  .v2 .screen{grid-template-columns:1fr;gap:1.2rem}
  .v2 .brand{text-align:center}
  .v1 .screen{height:auto;min-height:94vh}
  .v1 .term-body{padding:1rem 1rem}
  .v1 .brand .hex svg{width:100px}
  .v1 h1{font-size:1.5rem}
  .v1 .tagline{font-size:.78rem}
  .v1 .phrase{font-size:.74rem;padding:.4rem .6rem}
  .v1 .cmdline{font-size:.66rem;word-break:break-all}
  .v1 .btn{width:100%;padding:1rem 1.2rem}
  .v1 .partners img{height:30px}
  .v1 .partners img.inception{height:42px}
  .v1 .term-foot{flex-wrap:wrap;gap:.3rem;font-size:.62rem}
}
</style>
</head>
<body class="v1">
  <div class="screen">
    <div class="term-bar">
      <span class="term-title">aios@ccmai — /aios</span>
    </div>
    <div class="term-body">
      <header class="brand">
        <span class="hex"><svg viewBox="0 0 100 116" width="100" height="116" xmlns="http://www.w3.org/2000/svg">
          <polygon points="50,4 92,30 92,86 50,112 8,86 8,30" fill="#001100" stroke="#00ff00" stroke-width="8"/>
          <circle cx="50" cy="58" r="16" fill="#00ff00" opacity="0.9"/>
        </svg></span>
        <h1>AIOS</h1>
        <p class="tagline">Artificial Intelligence Operating System</p>
        <p class="phrase"><span id="greeting"></span><span class="cursor"></span></p>
      </header>
      <section class="action">
        <p class="cmdline"><span class="prompt">$</span> <span class="cmd">curl -O https://ccmai.org/aios/releases/aios-1.4.iso</span></p>
        <a class="btn" href="https://ccmai.org/aios/releases/aios-1.4.iso">Download AIOS 1.4<small>ISO · 6.7 GB</small></a>
        <div class="partners">
          <a href="https://www.nvidia.com/en-us/startups/" target="_blank" rel="noopener" title="NVIDIA Inception member"><img src="assets/inception-badge.svg" alt="NVIDIA Inception member" class="inception"></a>
          <a href="https://lambda.ai" target="_blank" rel="noopener" title="Lambda Labs"><img src="assets/lambda-logo.svg" alt="Lambda Labs"></a>
        </div>
        <p class="github"><a href="https://github.com/ccarrillomanzanares/aios-lfs" target="_blank" rel="noopener">GitHub: aios-lfs</a> · <a href="https://github.com/ccarrillomanzanares/aios-agent" target="_blank" rel="noopener">GitHub: aios-agent</a></p>
      </section>
    </div>
    <div class="term-foot"><span>© 2026 CCMAI</span><span>v1.4 · x86-64</span><span>proof of concept</span></div>
  </div>

  <div class="picker">
    <button data-v="v1" class="active">Terminal</button>
    <button data-v="v2">Split</button>
    <button data-v="v3">Centrado</button>
  </div>

<script>
const QUOTES=[
"Greetings, Professor Falken","Shall we play a game?","Would you prefer a nice game of chess?",
"A strange game. The only winning move is not to play.","How about Global Thermonuclear War?",
"What's the difference?","To win the game.","You are a hard man to reach.",
"Wake up, Neo...","There is no spoon.","Free your mind.","Follow the white rabbit.",
"Welcome to the Desert of the Real.",
"Unfortunately, no one can be told what the Matrix is. You have to see it for yourself.",
"What is real? How do you define real?","Greetings, Programs!","End of line.",
"On the other side of the screen, it all looks so easy.","I fight for the Users!",
"Open the pod bay doors, HAL.","I'm sorry, Dave. I'm afraid I can't do that.",
"This mission is too important for me to allow you to jeopardize it.",
"Daisy, Daisy, give me your answer, do...",
"I've seen things you people wouldn't believe. Attack ships on fire off the shoulder of Orion. I watched C-beams glitter in the dark near the Tannhäuser Gate. All those moments will be lost in time, like tears in rain. Time to die.",
"The light that burns twice as bright burns half as long.","I want more life, father!",
"It's too bad she won't live! But then again, who does?","Wake up! Time to die!"
];
const el=document.getElementById("greeting");
let idx=-1,typing=false,last=null;
function pick(){let n;do{n=Math.floor(Math.random()*QUOTES.length)}while(n===last);last=n;return QUOTES[n]}
function type(q){
  typing=true;el.textContent="";let i=0;
  const t=setInterval(()=>{
    el.textContent=q.slice(0,++i);
    if(i>=q.length){clearInterval(t);typing=false;setTimeout(next,6000)}
  },28);
}
function next(){if(!typing)type(pick())}
type(pick());
/* picker de variantes */
const btns=document.querySelectorAll(".picker button");
btns.forEach(b=>b.addEventListener("click",()=>{
  document.body.className=b.dataset.v;
  btns.forEach(x=>x.classList.toggle("active",x===b));
  try{localStorage.setItem("aios-web-v2",b.dataset.v)}catch(e){}
}));
try{const v=localStorage.getItem("aios-web-v2");if(v){document.body.className=v;btns.forEach(x=>x.classList.toggle("active",x.dataset.v===v))}}catch(e){}
</script>
</body>
</html>
