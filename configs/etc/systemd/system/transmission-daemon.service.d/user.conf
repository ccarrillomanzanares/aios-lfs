# AIOS: run the BitTorrent daemon as the desktop user, with the user's paths.
#
# Why this drop-in exists (root cause, not a patch):
#   The Arch package's unit runs as User=transmission (uid 169) and downloads in
#   /var/lib/transmission. In AIOS the media is consumed by the desktop user
#   (aios): a torrent fetched by uid 169 would land in root-owned territory and
#   the player could not read/delete it, and the user's own ~/Downloads would be
#   unusable. Hence: run as aios, with aios' config/home paths.
#
# The unit is NOT enabled at boot: torrent.py starts it on demand (systemctl start
# + a direct-launch fallback), so an unused ISO/laptop keeps no ports open and no
# background service.
[Service]
User=aios
# No Group= line on purpose: AIOS' user aios has primary group wheel (gid 1000);
# there is no group named "aios", and a wrong Group= makes the unit fail to start
# (216/GROUP). Omitting it makes systemd use the user's primary group.
# Arch ships User=transmission with its own XDG dirs; reset them for the user run.
Environment=HOME=/home/aios
Environment=XDG_CONFIG_HOME=/home/aios/.config
Environment=XDG_DATA_HOME=/home/aios/.local/share
Environment=XDG_CACHE_HOME=/home/aios/.cache
ExecStart=
ExecStart=/usr/bin/transmission-daemon -f --log-level=error --config-dir /home/aios/.config/transmission-daemon --download-dir /home/aios/Downloads --allowed 127.0.0.1,::1
# The package hardening (ProtectSystem, ProtectHome is absent) is kept; PrivateTmp
# is left on, downloads go to the real $HOME, not /tmp.
StateDirectory=
RuntimeDirectory=
ReadWritePaths=
ReadWritePaths=/home/aios /var/lib/transmission
