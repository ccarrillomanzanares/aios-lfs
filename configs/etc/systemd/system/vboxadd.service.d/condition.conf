[Unit]
ConditionVirtualization=oracle

[Service]
# Mainline kernel modules (vboxguest/vboxsf/vboxvideo) auto-load; the Oracle guest
# additions have no kernel modules for the LFS kernel, so its loader (vboxadd start)
# fails. Neutralize it: VBox support is already provided by the mainline modules.
ExecStart=
ExecStart=/bin/true
ExecStop=
ExecStop=/bin/true
