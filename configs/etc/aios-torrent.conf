# AIOS torrent client configuration
# ---------------------------------------------------------------------------
# This file holds the SYSTEM defaults. A user can override any key in
# ~/.aios/torrent.conf (same "key = value" syntax).
#
# Used by the aios-agent torrent tools (module: /usr/local/bin/aios-agent/torrent.py)
#   torrent_search / torrent_download / torrent_status / torrent_play / torrent_control

# Where downloads are stored (absolute path, or ~ which expands to the user's home)
download_dir = ~/Downloads

# Media player used by torrent_play
player = mpv

# Default number of search results
search_limit = 8

# Extra trackers added to every magnet link (public torrents only; keeps a
# torrent alive when the indexer's own tracker is unreachable).
trackers = udp://tracker.opentrackr.org:1337/announce,udp://open.demonii.com:1337/announce,udp://tracker.torrent.eu.org:451/announce,udp://exodus.desync.com:6969/announce

# Optional: protect the local RPC with credentials (default is localhost-only,
# no auth). If set, both keys must be filled in.
rpc_user =
rpc_password =
